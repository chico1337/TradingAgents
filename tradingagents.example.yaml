# Copy this file to tradingagents.local.yaml and edit it for your machine.
# Keep API keys and other secrets in .env.

llm_provider: litellm
backend_url: http://localhost:4000/v1
quick_think_llm: ovh-qwen3-32b
deep_think_llm: ovh-gpt-oss-120b

output_language: English
analysis_date: today
selected_analysts:
  - market
  - social
  - news
  - fundamentals
research_depth: 1

short_term_horizon: "2-10 trading days"
mid_term_horizon: "1-3 months"
primary_recommendation_horizon: short_term

auto_save_report: true
auto_display_report: true

data_vendors:
  core_stock_apis: yfinance
  technical_indicators: yfinance
  fundamental_data: yfinance
  news_data: yfinance
